<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <style>
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes draw{0%{transform:scaleX(0)}25%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    .col{animation:rise .7s ease-out both}
    .rule{transform-box:fill-box;transform-origin:left center;animation:draw 9s ease-in-out infinite}
  </style>
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a4d"/><stop offset="1" stop-color="#e8622a"/></linearGradient>
  </defs>
  <rect width="900" height="190" rx="14" fill="#0d1420"/>
  <rect x=".5" y=".5" width="899" height="189" rx="13.5" fill="none" stroke="#26324d"/>
  <rect x="36" y="22" width="3" height="16" rx="1.5" fill="url(#acc)"/>
  <text x="48" y="35" font-size="12.5" font-weight="700" fill="#e8ecf6" letter-spacing="3.5">HOW I WORK</text>
  <g class="col" style="animation-delay:0.0s">
  <rect x="36" y="58" width="184" height="1" fill="#26324d"/>
  <rect class="rule" style="animation-delay:0.3s" x="36" y="57" width="184" height="3" rx="1.5" fill="url(#acc)"/>
  <text x="36" y="88" font-size="12" font-weight="700" fill="#ff9a4d" letter-spacing="2" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace">01</text>
  <text x="36" y="112" font-size="17" font-weight="700" fill="#e8ecf6">Analytical approach</text>
  <text x="36" y="136" font-size="13" fill="#8b97b3">Break problems down and solve</text>
  <text x="36" y="154" font-size="13" fill="#8b97b3">them methodically.</text>
  </g>
  <g class="col" style="animation-delay:0.2s">
  <rect x="244" y="58" width="184" height="1" fill="#26324d"/>
  <rect class="rule" style="animation-delay:0.5s" x="244" y="57" width="184" height="3" rx="1.5" fill="url(#acc)"/>
  <text x="244" y="88" font-size="12" font-weight="700" fill="#ff9a4d" letter-spacing="2" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace">02</text>
  <text x="244" y="112" font-size="17" font-weight="700" fill="#e8ecf6">Fast learner</text>
  <text x="244" y="136" font-size="13" fill="#8b97b3">Pick up new tools quickly and</text>
  <text x="244" y="154" font-size="13" fill="#8b97b3">stay focused on the solution.</text>
  </g>
  <g class="col" style="animation-delay:0.4s">
  <rect x="452" y="58" width="184" height="1" fill="#26324d"/>
  <rect class="rule" style="animation-delay:0.7s" x="452" y="57" width="184" height="3" rx="1.5" fill="url(#acc)"/>
  <text x="452" y="88" font-size="12" font-weight="700" fill="#ff9a4d" letter-spacing="2" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace">03</text>
  <text x="452" y="112" font-size="17" font-weight="700" fill="#e8ecf6">Team collaboration</text>
  <text x="452" y="136" font-size="13" fill="#8b97b3">Work through code review and</text>
  <text x="452" y="154" font-size="13" fill="#8b97b3">clear, honest communication.</text>
  </g>
  <g class="col" style="animation-delay:0.6s">
  <rect x="660" y="58" width="184" height="1" fill="#26324d"/>
  <rect class="rule" style="animation-delay:0.9s" x="660" y="57" width="184" height="3" rx="1.5" fill="url(#acc)"/>
  <text x="660" y="88" font-size="12" font-weight="700" fill="#ff9a4d" letter-spacing="2" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace">04</text>
  <text x="660" y="112" font-size="17" font-weight="700" fill="#e8ecf6">Client focus</text>
  <text x="660" y="136" font-size="13" fill="#8b97b3">Understand the requirements</text>
  <text x="660" y="154" font-size="13" fill="#8b97b3">before building anything.</text>
  </g>
</svg>

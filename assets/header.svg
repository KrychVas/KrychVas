<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <style>
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.8)}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes glowA{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-16px)}}
    @keyframes glowB{0%,100%{transform:translate(0,0)}50%{transform:translate(-36px,18px)}}
    @keyframes nameclip{0%{width:0}5.01%{width:36.6px}5.92%{width:67.5px}7.05%{width:97.2px}7.9%{width:129.4px}8.78%{width:143.5px}10.71%{width:155.8px}12.9%{width:194.1px}13.78%{width:216.5px}14.73%{width:247.5px}15.78%{width:278.8px}16.41%{width:311.9px}17.17%{width:331.8px}17.81%{width:362.7px}18.87%{width:376.8px}19.85%{width:409.9px}20.46%{width:439.7px}21.62%{width:472.8px}22.76%{width:486.9px}23.73%{width:501.1px}94%{width:0}}
    @keyframes namecur{0%{transform:translateX(0)}5.01%{transform:translateX(36.6px)}5.92%{transform:translateX(67.5px)}7.05%{transform:translateX(97.2px)}7.9%{transform:translateX(129.4px)}8.78%{transform:translateX(143.5px)}10.71%{transform:translateX(155.8px)}12.9%{transform:translateX(194.1px)}13.78%{transform:translateX(216.5px)}14.73%{transform:translateX(247.5px)}15.78%{transform:translateX(278.8px)}16.41%{transform:translateX(311.9px)}17.17%{transform:translateX(331.8px)}17.81%{transform:translateX(362.7px)}18.87%{transform:translateX(376.8px)}19.85%{transform:translateX(409.9px)}20.46%{transform:translateX(439.7px)}21.62%{transform:translateX(472.8px)}22.76%{transform:translateX(486.9px)}23.73%{transform:translateX(501.1px)}94%{transform:translateX(0)}}
    @keyframes l0{0%,7.50%{opacity:0;transform:translateX(-6px)}9.10%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}
    @keyframes l1{0%,12.08%{opacity:0;transform:translateX(-6px)}13.68%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}
    @keyframes l2{0%,16.67%{opacity:0;transform:translateX(-6px)}18.27%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}
    @keyframes l3{0%,21.25%{opacity:0;transform:translateX(-6px)}22.85%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}
    @keyframes l4{0%,25.83%{opacity:0;transform:translateX(-6px)}27.43%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}
    @keyframes l5{0%,30.42%{opacity:0;transform:translateX(-6px)}32.02%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}
    @keyframes l6{0%,35.00%{opacity:0;transform:translateX(-6px)}36.60%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}
    @keyframes l7{0%,39.58%{opacity:0;transform:translateX(-6px)}41.18%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}
    .nameclip{animation:nameclip 12s step-end infinite}
    .namecur{animation:namecur 12s step-end infinite}
    .caret{animation:blink 1s steps(1) infinite}
    .dot{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
    .gA{animation:glowA 14s ease-in-out infinite}
    .gB{animation:glowB 16s ease-in-out infinite}
    .r1{animation:rise .8s ease-out .1s both}
    .r2{animation:rise .8s ease-out .35s both}
    .r3{animation:rise .8s ease-out .6s both}
    .cur2{animation:blink 1s steps(1) infinite}
  </style>
  <defs>
    <radialGradient id="ga" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e8622a" stop-opacity=".22"/><stop offset="1" stop-color="#e8622a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4f6bd8" stop-opacity=".26"/><stop offset="1" stop-color="#4f6bd8" stop-opacity="0"/></radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a4d"/><stop offset="1" stop-color="#e8622a"/></linearGradient>
    <clipPath id="frame"><rect width="900" height="300" rx="14"/></clipPath>
    <clipPath id="nc"><rect class="nameclip" x="40" y="70" width="0" height="70"/></clipPath>
  </defs>

  <rect width="900" height="300" rx="14" fill="#0d1420"/>
  <g clip-path="url(#frame)">
    <circle class="gA" cx="120" cy="290" r="210" fill="url(#ga)"/>
    <circle class="gB" cx="780" cy="30" r="240" fill="url(#gb)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="299" rx="13.5" fill="none" stroke="#26324d"/>

  <g class="r1">
    <rect x="40" y="38" width="3" height="16" rx="1.5" fill="url(#acc)"/>
    <text x="52" y="51" font-size="12.5" font-weight="700" fill="#ff9a4d" letter-spacing="3.5">FULLSTACK DEVELOPER</text>
  </g>

  <text id="nm" x="40" y="124" font-size="54" font-weight="700" fill="#e8ecf6" letter-spacing="-.5" clip-path="url(#nc)">Vasyl Krychfalushii</text>
  <g class="namecur"><rect class="caret" x="44" y="80" width="3" height="50" rx="1.5" fill="#ff9a4d"/></g>

  <g class="r2">
    <text x="40" y="162" font-size="18" fill="#b9c3dc">I build interactive web applications with</text>
    <text x="40" y="187" font-size="18" fill="#b9c3dc">JavaScript and TypeScript, from UI to API.</text>
  </g>

  <g class="r3">
    <rect x="40" y="218" width="112" height="30" rx="8" fill="#111a2c" stroke="#26324d"/>
    <text x="96" y="237.5" font-size="13" fill="#c9d2e8" text-anchor="middle">Prague, CZ</text>
    <rect x="162" y="218" width="236" height="30" rx="8" fill="#111a2c" stroke="#26324d"/>
    <text x="280" y="237.5" font-size="13" fill="#c9d2e8" text-anchor="middle">RS School · Full-Stack JS 2026</text>
    <rect x="408" y="218" width="132" height="30" rx="8" fill="#1a1f2c" stroke="#6b3f26"/>
    <circle class="dot" cx="428" cy="233" r="4" fill="#ff9a4d"/>
    <text x="443" y="237.5" font-size="13" font-weight="600" fill="#ffc29a">Open to work</text>
  </g>

  <!-- code card -->
  <g class="r2">
    <rect x="592" y="34" width="272" height="232" rx="12" fill="#111a2c" stroke="#26324d"/>
    <path d="M592 46a12 12 0 0 1 12-12h248a12 12 0 0 1 12 12v22H592z" fill="#16213a"/>
    <circle cx="612" cy="51" r="4.5" fill="#34415f"/><circle cx="628" cy="51" r="4.5" fill="#34415f"/><circle cx="644" cy="51" r="4.5" fill="#34415f"/>
    <text x="700" y="55" font-size="11" fill="#8b97b3" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace">developer.ts</text>
  </g>
  <text class="cl" style="animation:l0 12s linear infinite" x="612" y="80" font-size="12.5" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#b4a5ff" xml:space="preserve">const </tspan><tspan fill="#e8ecf6" xml:space="preserve">developer</tspan><tspan fill="#8b97b3" xml:space="preserve"> = {</tspan></text>
  <text class="cl" style="animation:l1 12s linear infinite" x="612" y="102" font-size="12.5" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#8b97b3" xml:space="preserve">  </tspan><tspan fill="#8fb4ff" xml:space="preserve">role</tspan><tspan fill="#8b97b3" xml:space="preserve">: </tspan><tspan fill="#ffb07a" xml:space="preserve">"Fullstack"</tspan><tspan fill="#8b97b3" xml:space="preserve">,</tspan></text>
  <text class="cl" style="animation:l2 12s linear infinite" x="612" y="124" font-size="12.5" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#8b97b3" xml:space="preserve">  </tspan><tspan fill="#8fb4ff" xml:space="preserve">based</tspan><tspan fill="#8b97b3" xml:space="preserve">: </tspan><tspan fill="#ffb07a" xml:space="preserve">"Prague, CZ"</tspan><tspan fill="#8b97b3" xml:space="preserve">,</tspan></text>
  <text class="cl" style="animation:l3 12s linear infinite" x="612" y="146" font-size="12.5" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#8b97b3" xml:space="preserve">  </tspan><tspan fill="#8fb4ff" xml:space="preserve">stack</tspan><tspan fill="#8b97b3" xml:space="preserve">: [</tspan><tspan fill="#ffb07a" xml:space="preserve">"JS"</tspan><tspan fill="#8b97b3" xml:space="preserve">, </tspan><tspan fill="#ffb07a" xml:space="preserve">"TS"</tspan><tspan fill="#8b97b3" xml:space="preserve">, </tspan><tspan fill="#ffb07a" xml:space="preserve">"Vite"</tspan><tspan fill="#8b97b3" xml:space="preserve">],</tspan></text>
  <text class="cl" style="animation:l4 12s linear infinite" x="612" y="168" font-size="12.5" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#8b97b3" xml:space="preserve">  </tspan><tspan fill="#8fb4ff" xml:space="preserve">learning</tspan><tspan fill="#8b97b3" xml:space="preserve">: </tspan><tspan fill="#ffb07a" xml:space="preserve">"RS School"</tspan><tspan fill="#8b97b3" xml:space="preserve">,</tspan></text>
  <text class="cl" style="animation:l5 12s linear infinite" x="612" y="190" font-size="12.5" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#8b97b3" xml:space="preserve">  </tspan><tspan fill="#8fb4ff" xml:space="preserve">goal</tspan><tspan fill="#8b97b3" xml:space="preserve">: </tspan><tspan fill="#ffb07a" xml:space="preserve">"AI Fullstack"</tspan><tspan fill="#8b97b3" xml:space="preserve">,</tspan></text>
  <text class="cl" style="animation:l6 12s linear infinite" x="612" y="212" font-size="12.5" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#8b97b3" xml:space="preserve">  </tspan><tspan fill="#8fb4ff" xml:space="preserve">openToWork</tspan><tspan fill="#8b97b3" xml:space="preserve">: </tspan><tspan fill="#6fe0b0" xml:space="preserve">true</tspan><tspan fill="#8b97b3" xml:space="preserve">,</tspan></text>
  <text class="cl" style="animation:l7 12s linear infinite" x="612" y="234" font-size="12.5" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#8b97b3" xml:space="preserve">};</tspan></text>
  <g style="animation:l7 12s linear infinite"><rect class="cur2" x="612" y="244" width="7" height="14" fill="#ff9a4d" opacity=".9"/></g>
</svg>

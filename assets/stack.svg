<svg xmlns="http://www.w3.org/2000/svg" width="900" height="268" viewBox="0 0 900 268" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <style>
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes sweep{0%{transform:translateX(-200px)}55%,100%{transform:translateX(1000px)}}
    .row,.chip{animation:rise .6s ease-out both}
    .sweep{animation:sweep 8s ease-in-out infinite}
  </style>
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a4d"/><stop offset="1" stop-color="#e8622a"/></linearGradient>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a4d" stop-opacity="0"/><stop offset=".5" stop-color="#ff9a4d" stop-opacity=".9"/><stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/></linearGradient>
    <clipPath id="ln"><rect x="36" y="50" width="828" height="2"/></clipPath>
  </defs>
  <rect width="900" height="268" rx="14" fill="#0d1420"/>
  <rect x=".5" y=".5" width="899" height="267" rx="13.5" fill="none" stroke="#26324d"/>
  <rect x="36" y="34" width="3" height="16" rx="1.5" fill="url(#acc)"/>
  <text x="48" y="47" font-size="12.5" font-weight="700" fill="#e8ecf6" letter-spacing="3.5">TECH STACK</text>
  <rect x="36" y="56" width="828" height="1" fill="#1b2640"/>
  <g clip-path="url(#ln)"><rect class="sweep" x="36" y="50" width="200" height="2" fill="url(#sw)" transform="translate(0,5)"/></g>
  <g class="row" style="animation-delay:0.00s">
  <text x="36" y="93" font-size="11.5" font-weight="700" fill="#8b97b3" letter-spacing="2.5">CORE</text>
  <g class="chip" style="animation-delay:0.00s"><rect x="176" y="74" width="65" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="208.5" y="92.5" font-size="13" fill="#d7deef" text-anchor="middle">HTML5</text></g>
  <g class="chip" style="animation-delay:0.08s"><rect x="251" y="74" width="58" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="280.0" y="92.5" font-size="13" fill="#d7deef" text-anchor="middle">CSS3</text></g>
  <g class="chip" style="animation-delay:0.16s"><rect x="319" y="74" width="102" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="370.0" y="92.5" font-size="13" fill="#d7deef" text-anchor="middle">JavaScript</text></g>
  <g class="chip" style="animation-delay:0.24s"><rect x="431" y="74" width="102" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="482.0" y="92.5" font-size="13" fill="#d7deef" text-anchor="middle">TypeScript</text></g>
  <g class="chip" style="animation-delay:0.32s"><rect x="543" y="74" width="87" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="586.5" y="92.5" font-size="13" fill="#d7deef" text-anchor="middle">REST API</text></g>
  <g class="chip" style="animation-delay:0.40s"><rect x="640" y="74" width="50" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="665.0" y="92.5" font-size="13" fill="#d7deef" text-anchor="middle">BEM</text></g>
  <rect x="36" y="111" width="828" height="1" fill="#1b2640"/>
  </g>
  <g class="row" style="animation-delay:0.15s">
  <text x="36" y="139" font-size="11.5" font-weight="700" fill="#8b97b3" letter-spacing="2.5">TOOLING</text>
  <g class="chip" style="animation-delay:0.20s"><rect x="176" y="120" width="58" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="205.0" y="138.5" font-size="13" fill="#d7deef" text-anchor="middle">Vite</text></g>
  <g class="chip" style="animation-delay:0.28s"><rect x="244" y="120" width="80" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="284.0" y="138.5" font-size="13" fill="#d7deef" text-anchor="middle">Node.js</text></g>
  <g class="chip" style="animation-delay:0.36s"><rect x="334" y="120" width="50" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="359.0" y="138.5" font-size="13" fill="#d7deef" text-anchor="middle">npm</text></g>
  <g class="chip" style="animation-delay:0.44s"><rect x="394" y="120" width="72" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="430.0" y="138.5" font-size="13" fill="#d7deef" text-anchor="middle">ESLint</text></g>
  <g class="chip" style="animation-delay:0.52s"><rect x="476" y="120" width="50" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="501.0" y="138.5" font-size="13" fill="#d7deef" text-anchor="middle">Git</text></g>
  <g class="chip" style="animation-delay:0.60s"><rect x="536" y="120" width="72" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="572.0" y="138.5" font-size="13" fill="#d7deef" text-anchor="middle">GitHub</text></g>
  <g class="chip" style="animation-delay:0.68s"><rect x="618" y="120" width="80" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="658.0" y="138.5" font-size="13" fill="#d7deef" text-anchor="middle">VS Code</text></g>
  <g class="chip" style="animation-delay:0.76s"><rect x="708" y="120" width="87" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="751.5" y="138.5" font-size="13" fill="#d7deef" text-anchor="middle">WebStorm</text></g>
  <rect x="36" y="157" width="828" height="1" fill="#1b2640"/>
  </g>
  <g class="row" style="animation-delay:0.30s">
  <text x="36" y="185" font-size="11.5" font-weight="700" fill="#8b97b3" letter-spacing="2.5">DESIGN</text>
  <g class="chip" style="animation-delay:0.40s"><rect x="176" y="166" width="65" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="208.5" y="184.5" font-size="13" fill="#d7deef" text-anchor="middle">Figma</text></g>
  <g class="chip" style="animation-delay:0.48s"><rect x="251" y="166" width="95" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="298.5" y="184.5" font-size="13" fill="#d7deef" text-anchor="middle">Photoshop</text></g>
  <rect x="36" y="203" width="828" height="1" fill="#1b2640"/>

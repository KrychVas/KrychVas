  <g class="row" style="animation-delay:0.45s">
  <text x="36" y="231" font-size="11.5" font-weight="700" fill="#8b97b3" letter-spacing="2.5">DEPLOYMENT</text>
  <g class="chip" style="animation-delay:0.60s"><rect x="176" y="212" width="117" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="234.5" y="230.5" font-size="13" fill="#d7deef" text-anchor="middle">GitHub Pages</text></g>
  <g class="chip" style="animation-delay:0.68s"><rect x="303" y="212" width="80" height="28" rx="7" fill="#111a2c" stroke="#26324d"/><text x="343.0" y="230.5" font-size="13" fill="#d7deef" text-anchor="middle">Netlify</text></g>
